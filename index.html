<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>销售看板</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --navy: #16232e;
    --navy-soft: #202f3c;
    --paper: #f4efe1;
    --paper-line: #e3dcc8;
    --ink: #212b33;
    --slate: #6b7885;
    --mustard: #d9a430;
    --coral: #c9622d;
    --good: #4f7a5a;
    --radius: 10px;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--paper);
    color: var(--ink);
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  .mono { font-family: 'IBM Plex Mono', monospace; }

  header {
    background: var(--navy);
    color: var(--paper);
    padding: 28px 24px 24px;
  }
  header .inner {
    max-width: 880px;
    margin: 0 auto;
  }
  header h1 {
    font-family: 'Oswald', sans-serif;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.03em;
    font-size: clamp(24px, 4vw, 32px);
    margin: 0 0 4px;
  }
  header p {
    margin: 0;
    color: #a9b7c1;
    font-size: 13px;
    letter-spacing: 0.02em;
  }

  main {
    max-width: 880px;
    margin: 0 auto;
    padding: 24px;
  }

  .panel {
    background: #fffdf8;
    border: 1px solid var(--paper-line);
    border-radius: var(--radius);
    padding: 20px;
    margin-bottom: 20px;
  }

  .tabs {
    display: flex;
    gap: 8px;
    margin-bottom: 16px;
    flex-wrap: wrap;
  }
  .tab {
    border: 1px solid var(--paper-line);
    background: var(--paper);
    color: var(--slate);
    padding: 7px 16px;
    border-radius: 999px;
    font-size: 13px;
    font-weight: 500;
    cursor: pointer;
    transition: all 0.15s ease;
  }
  .tab.active {
    background: var(--navy);
    border-color: var(--navy);
    color: var(--paper);
  }

  .field-row {
    display: flex;
    gap: 12px;
    align-items: flex-end;
    flex-wrap: wrap;
  }
  .field {
    display: flex;
    flex-direction: column;
    gap: 5px;
  }
  .field label {
    font-size: 12px;
    color: var(--slate);
    text-transform: uppercase;
    letter-spacing: 0.05em;
  }
  input[type="date"] {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 14px;
    padding: 8px 10px;
    border: 1px solid var(--paper-line);
    border-radius: 6px;
    background: #fff;
    color: var(--ink);
  }
  button.primary {
    background: var(--coral);
    color: #fff;
    border: none;
    padding: 10px 22px;
    border-radius: 6px;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    transition: background 0.15s ease;
  }
  button.primary:hover { background: #b3541f; }
  button.primary:disabled { background: #cbb9ab; cursor: not-allowed; }

  .status {
    font-size: 13px;
    color: var(--slate);
    margin-top: 12px;
  }
  .status.error { color: #a83b3b; }

  .stat-row {
    display: flex;
    gap: 16px;
    flex-wrap: wrap;
    margin-bottom: 8px;
  }
  .stat {
    flex: 1;
    min-width: 160px;
    background: var(--navy);
    color: var(--paper);
    border-radius: var(--radius);
    padding: 16px 18px;
  }
  .stat .label {
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: #a9b7c1;
    margin-bottom: 6px;
  }
  .stat .value {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 26px;
    font-weight: 600;
    color: var(--mustard);
  }
  .stat .sub {
    font-size: 12px;
    color: #a9b7c1;
    margin-top: 4px;
  }

  .category-block {
    margin-top: 22px;
  }
  .category-block h3 {
    font-family: 'Oswald', sans-serif;
    font-size: 15px;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: var(--slate);
    margin: 0 0 10px;
    padding-bottom: 6px;
    border-bottom: 1px solid var(--paper-line);
  }
  .item-row {
    position: relative;
    display: flex;
    align-items: center;
    padding: 7px 2px;
    font-size: 14px;
  }
  .item-row .bar {
    position: absolute;
    left: 0; top: 0; bottom: 0;
    background: #f0e2c2;
    z-index: 0;
    border-radius: 3px;
  }
  .item-row .name {
    position: relative;
    z-index: 1;
    flex-shrink: 0;
    padding-right: 8px;
  }
  .item-row .dots {
    position: relative;
    z-index: 1;
    flex: 1;
    border-bottom: 1px dotted #c4b89a;
    margin-bottom: 4px;
  }
  .item-row .qty {
    position: relative;
    z-index: 1;
    font-family: 'IBM Plex Mono', monospace;
    font-weight: 600;
    padding-left: 8px;
    flex-shrink: 0;
    min-width: 46px;
    text-align: right;
  }

  .missing-note {
    font-size: 12px;
    color: var(--slate);
    margin-top: 16px;
    padding-top: 12px;
    border-top: 1px dashed var(--paper-line);
  }

  .config-warning {
    background: #fff3e0;
    border: 1px solid #e8c88a;
    color: #7a5620;
    padding: 12px 16px;
    border-radius: 8px;
    font-size: 13px;
    margin-bottom: 20px;
    line-height: 1.5;
  }
  .config-warning code {
    background: rgba(0,0,0,0.06);
    padding: 1px 5px;
    border-radius: 4px;
  }

  footer {
    max-width: 880px;
    margin: 0 auto;
    padding: 8px 24px 40px;
    font-size: 12px;
    color: var(--slate);
  }
</style>
</head>
<body>

<header>
  <div class="inner">
    <h1>销售看板</h1>
    <p id="repoLabel" class="mono">Square Sales Dashboard</p>
  </div>
</header>

<main>

  <div id="configWarning" class="config-warning" style="display:none;">
    还没配置好。请打开这个 index.html 文件,找到底部
    <code>const CONFIG = {...}</code> 这一段,把 owner / repo / token 三个值改成你自己的,
    保存后重新上传到 GitHub Pages 仓库。
  </div>

  <div class="panel">
    <div class="tabs">
      <div class="tab active" data-mode="day">单日</div>
      <div class="tab" data-mode="week">整周</div>
      <div class="tab" data-mode="range">自定义区间</div>
    </div>

    <div id="fieldsDay" class="field-row">
      <div class="field">
        <label>日期</label>
        <input type="date" id="dayInput" />
      </div>
    </div>

    <div id="fieldsWeek" class="field-row" style="display:none;">
      <div class="field">
        <label>选这一周里任意一天(自动取周一到周日)</label>
        <input type="date" id="weekInput" />
      </div>
    </div>

    <div id="fieldsRange" class="field-row" style="display:none;">
      <div class="field">
        <label>开始日期</label>
        <input type="date" id="rangeStart" />
      </div>
      <div class="field">
        <label>结束日期</label>
        <input type="date" id="rangeEnd" />
      </div>
    </div>

    <div class="field-row" style="margin-top:14px;">
      <button class="primary" id="queryBtn">查询</button>
    </div>

    <div id="statusMsg" class="status"></div>
  </div>

  <div id="results"></div>

</main>

<footer>
  数据来自私有 GitHub 仓库,通过只读 token 拉取,请勿把此页面链接分享给不信任的人。
</footer>

<script>
// ============================================================
// 配置区: 改成你自己的仓库信息和 token
// ============================================================
const CONFIG = {
  owner: "elvacheng7723",       // 例如 "elvacheng7723"
  repo: "square-sales-report",     // 存放 reports/ 数据的那个私有仓库名
  token: "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",
};
// ============================================================

const el = (id) => document.getElementById(id);

function toISO(d) {
  return d.toISOString().slice(0, 10);
}

function dateRangeArray(startStr, endStr) {
  const dates = [];
  let cur = new Date(startStr + "T00:00:00");
  const end = new Date(endStr + "T00:00:00");
  while (cur <= end) {
    dates.push(toISO(cur));
    cur.setDate(cur.getDate() + 1);
  }
  return dates;
}

function getWeekRange(dateStr) {
  const d = new Date(dateStr + "T00:00:00");
  const day = d.getDay(); // 0=周日 ... 6=周六
  const diffToMonday = day === 0 ? -6 : 1 - day;
  const monday = new Date(d);
  monday.setDate(d.getDate() + diffToMonday);
  const sunday = new Date(monday);
  sunday.setDate(monday.getDate() + 6);
  return [toISO(monday), toISO(sunday)];
}

async function fetchReport(date) {
  const url = `https://api.github.com/repos/${CONFIG.owner}/${CONFIG.repo}/contents/reports/${date}.json`;
  const res = await fetch(url, {
    headers: {
      Authorization: `Bearer ${CONFIG.token}`,
      Accept: "application/vnd.github.raw+json",
      "X-GitHub-Api-Version": "2022-11-28",
    },
  });

  if (res.status === 404) {
    return { date, found: false };
  }
  if (res.status === 401 || res.status === 403) {
    throw new Error("token无效或没有权限,请检查CONFIG里的token是否正确、是否已授权访问这个仓库");
  }
  if (!res.ok) {
    throw new Error(`拉取 ${date} 失败: HTTP ${res.status}`);
  }

  const text = await res.text();
  try {
    return { date, found: true, data: JSON.parse(text) };
  } catch (e) {
    return { date, found: false };
  }
}

function aggregate(reports) {
  const agg = {
    chipsSalesCents: 0,
    chipsPortionFromPacksQty: 0,
    byCategory: {}, // category -> { target -> qty }
    missingDates: [],
    ordersCount: 0,
    daysFound: 0,
  };

  for (const r of reports) {
    if (!r.found) {
      agg.missingDates.push(r.date);
      continue;
    }
    agg.daysFound += 1;
    const d = r.data;
    agg.chipsSalesCents += d.chipsSalesCents || 0;
    agg.chipsPortionFromPacksQty += d.chipsPortionFromPacksQty || 0;
    agg.ordersCount += d.ordersCount || 0;

    for (const [target, entry] of Object.entries(d.qtySummary || {})) {
      if (!agg.byCategory[entry.category]) agg.byCategory[entry.category] = {};
      agg.byCategory[entry.category][target] =
        (agg.byCategory[entry.category][target] || 0) + (entry.total || 0);
    }
  }

  return agg;
}

function render(agg, rangeLabel) {
  el("repoLabel").textContent = rangeLabel;

  const chipsDollar = (agg.chipsSalesCents / 100).toFixed(2);

  let html = `
    <div class="panel">
      <div class="stat-row">
        <div class="stat">
          <div class="label">薯条营业额</div>
          <div class="value">$${chipsDollar}</div>
          ${agg.chipsPortionFromPacksQty > 0 ? `<div class="sub">另有 ${agg.chipsPortionFromPacksQty} 份薯条来自套餐,未计入金额</div>` : ""}
        </div>
        <div class="stat">
          <div class="label">已完成订单数</div>
          <div class="value">${agg.ordersCount}</div>
          <div class="sub">${agg.daysFound} 天有数据</div>
        </div>
      </div>
    </div>
  `;

  const categories = Object.keys(agg.byCategory);
  if (categories.length === 0) {
    html += `<div class="panel"><div class="status">这个时间段没有找到商品数据。</div></div>`;
  } else {
    html += `<div class="panel">`;
    for (const category of categories) {
      const items = Object.entries(agg.byCategory[category]).sort((a, b) => b[1] - a[1]);
      const maxQty = Math.max(...items.map(([, q]) => q));
      html += `<div class="category-block"><h3>${escapeHtml(category)}</h3>`;
      for (const [name, qty] of items) {
        const widthPct = maxQty > 0 ? Math.max(4, (qty / maxQty) * 100) : 0;
        html += `
          <div class="item-row">
            <div class="bar" style="width:${widthPct}%;"></div>
            <span class="name">${escapeHtml(name)}</span>
            <span class="dots"></span>
            <span class="qty">${qty}</span>
          </div>
        `;
      }
      html += `</div>`;
    }
    html += `</div>`;
  }

  if (agg.missingDates.length > 0) {
    html += `<div class="panel"><div class="missing-note">以下日期没有找到报告(可能当天未营业或还没跑定时任务): ${agg.missingDates.join(", ")}</div></div>`;
  }

  el("results").innerHTML = html;
}

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, (c) => ({
    "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;",
  }[c]));
}

async function runQuery(dates, rangeLabel) {
  const btn = el("queryBtn");
  const statusMsg = el("statusMsg");
  btn.disabled = true;
  statusMsg.className = "status";
  statusMsg.textContent = `正在拉取 ${dates.length} 天的数据...`;
  el("results").innerHTML = "";

  try {
    const reports = await Promise.all(dates.map(fetchReport));
    const agg = aggregate(reports);
    render(agg, rangeLabel);
    statusMsg.textContent = `完成,共 ${agg.daysFound}/${dates.length} 天有数据。`;
  } catch (err) {
    statusMsg.className = "status error";
    statusMsg.textContent = err.message || String(err);
  } finally {
    btn.disabled = false;
  }
}

// --- 模式切换 ---
let currentMode = "day";
document.querySelectorAll(".tab").forEach((tab) => {
  tab.addEventListener("click", () => {
    document.querySelectorAll(".tab").forEach((t) => t.classList.remove("active"));
    tab.classList.add("active");
    currentMode = tab.dataset.mode;
    el("fieldsDay").style.display = currentMode === "day" ? "flex" : "none";
    el("fieldsWeek").style.display = currentMode === "week" ? "flex" : "none";
    el("fieldsRange").style.display = currentMode === "range" ? "flex" : "none";
  });
});

// --- 默认日期设为今天 ---
const todayStr = toISO(new Date());
el("dayInput").value = todayStr;
el("weekInput").value = todayStr;
el("rangeEnd").value = todayStr;

// --- 查询按钮 ---
el("queryBtn").addEventListener("click", () => {
  if (currentMode === "day") {
    const d = el("dayInput").value;
    if (!d) return;
    runQuery([d], d);
  } else if (currentMode === "week") {
    const d = el("weekInput").value;
    if (!d) return;
    const [start, end] = getWeekRange(d);
    runQuery(dateRangeArray(start, end), `${start} ~ ${end}`);
  } else {
    const start = el("rangeStart").value;
    const end = el("rangeEnd").value;
    if (!start || !end) return;
    runQuery(dateRangeArray(start, end), `${start} ~ ${end}`);
  }
});

// --- 配置检查 ---
if (CONFIG.token.includes("在这里粘贴") || CONFIG.owner.includes("你的GitHub")) {
  el("configWarning").style.display = "block";
}
</script>

</body>
</html>
